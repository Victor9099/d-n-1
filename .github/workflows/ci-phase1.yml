# ============================================================================
# CI Phase 1 — Quality, Migration and Contract Gates
# ============================================================================
# Runs on: push to main, PRs to main
# Validates: Prisma schema, contracts, basic quality
# ============================================================================

name: CI Phase 1

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # Prisma Schema Validation
  # --------------------------------------------------------------------------
  prisma:
    name: Prisma Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: em
          POSTGRES_PASSWORD: em_ci
          POSTGRES_DB: em_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U em -d em_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://em:em_ci@localhost:5432/em_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile

      - name: Validate Prisma Schema
        run: bun run --filter @ecom/db db:validate

      - name: Generate Prisma Client
        run: bun run --filter @ecom/db db:generate

      - name: Run Migrations
        run: bun run --filter @ecom/db db:migrate:deploy

      - name: Run Seed
        run: bun run --filter @ecom/db db:seed
        continue-on-error: true

  # --------------------------------------------------------------------------
  # Contract Compatibility
  # --------------------------------------------------------------------------
  contracts:
    name: Contract Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile

      - name: Generate Types from OpenAPI
        run: bun run --filter @ecom/contracts codegen

      - name: Verify Generated Types Match
        run: |
          git diff --exit-code contracts/generated/schema.ts || \
            (echo "❌ Generated types are out of date. Run: bun run codegen" && exit 1)

      - name: TypeCheck Contracts
        run: bun run --filter @ecom/contracts typecheck

  # --------------------------------------------------------------------------
  # DB Package TypeCheck
  # --------------------------------------------------------------------------
  db-typecheck:
    name: DB TypeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://em:em_ci@localhost:5432/em_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun run --filter @ecom/db db:generate

      - name: TypeCheck DB Package
        run: bun run --filter @ecom/db typecheck

  # --------------------------------------------------------------------------
  # Docker Compose Validation
  # --------------------------------------------------------------------------
  docker-validate:
    name: Docker Compose Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Validate Dockerfiles
        run: |
          for app in api storefront admin; do
            echo "Validating apps/$app/Dockerfile..."
            docker build --check -f apps/$app/Dockerfile . 2>/dev/null || \
              echo "⚠️  Dockerfile build check skipped (requires full build context)"
          done
          echo "Validating tools/vnpay-simulator/Dockerfile..."
          docker build --check -f tools/vnpay-simulator/Dockerfile tools/vnpay-simulator/ 2>/dev/null || true
