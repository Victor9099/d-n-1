# ═══════════════════════════════════════════
# Docker Compose for LiteLLM Proxy
# ═══════════════════════════════════════════
# Usage: docker-compose up -d

version: '3.8'

services:
  # ═══════════════════════════════════════════
  # LiteLLM Proxy
  # ═══════════════════════════════════════════
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-proxy
    ports:
      - "4000:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - DATABASE_URL=postgresql://litellm:litellm@postgres:5432/litellm
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    command: --config /app/config.yaml --port 4000 --detailed_debug
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - litellm-network

  # ═══════════════════════════════════════════
  # PostgreSQL (for tracking & analytics)
  # ═══════════════════════════════════════════
  postgres:
    image: postgres:15-alpine
    container_name: litellm-postgres
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - litellm-network

  # ═══════════════════════════════════════════
  # Redis (for caching)
  # ═══════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: litellm-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - litellm-network

  # ═══════════════════════════════════════════
  # Redis Commander (Redis GUI - Optional)
  # ═══════════════════════════════════════════
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: litellm-redis-gui
    environment:
      - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD:-redis}
      - HTTP_USER=admin
      - HTTP_PASSWORD=admin
    ports:
      - "8081:8081"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - litellm-network

  # ═══════════════════════════════════════════
  # pgAdmin (PostgreSQL GUI - Optional)
  # ═══════════════════════════════════════════
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: litellm-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@localhost.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8082:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - litellm-network

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:

networks:
  litellm-network:
    driver: bridge

# ═══════════════════════════════════════════
# USAGE
# ═══════════════════════════════════════════
#
# 1. Create .env file:
#    cp .env.example .env
#    nano .env  # Edit with your API keys
#
# 2. Start services:
#    docker-compose up -d
#
# 3. Check logs:
#    docker-compose logs -f litellm
#
# 4. Access dashboards:
#    - LiteLLM: http://localhost:4000
#    - Redis GUI: http://localhost:8081 (admin/admin)
#    - pgAdmin: http://localhost:8082 (admin@localhost.com/admin)
#
# 5. Stop services:
#    docker-compose down
#
# 6. Stop and remove volumes:
#    docker-compose down -v
#
# ═══════════════════════════════════════════
