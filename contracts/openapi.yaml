openapi: 3.1.0
info:
  title: Êm Clothing Commerce Platform API
  version: 1.0.0
  description: |
    Vietnam-first direct-to-consumer clothing commerce platform.
    All money values are integer VND. All IDs are opaque UUIDs.
    All timestamps are UTC ISO-8601.

    ## Cross-Cutting Protocol Rules

    ### Idempotency Protocol
    Commands marked idempotent require `Idempotency-Key` header binding:
    - One actor/scope + operation + canonical payload
    - Compatible replay returns original status/body
    - Payload mismatch returns stable `idempotency_payload_mismatch` code
    - **Persistence/rotation rule**: Client persists current key through timeout
      and reload until result resolves. Key rotates ONLY after: material edit,
      new quote, or explicitly new command. Never rotate on transient failure.

    ### Optimistic Concurrency
    Mutable projections include `aggregateVersion` and `serverTime`.
    Mutations requiring concurrency control accept `If-Match` header with
    expected version. Mismatch returns 409 Conflict.

    ### Polling Protocol
    - Clients accept only monotonically newer versions
    - Clients cancel superseded polls when newer version arrives
    - Polling stops when no `permittedNextActions` remain (terminal state)

    ### Browser Security Protocol
    - Session cookies: Secure, HttpOnly, configured SameSite policy
    - State changes enforce origin and CSRF protections
    - Token redemption pages: `Referrer-Policy: no-referrer`, no third-party
      resources before token removal
    - Raw OTP/lookup/claim values prohibited in URLs after redemption,
      logs, telemetry, browser storage, debug data
    - Protected cache keys include authenticated subject + permission projection
    - Logout/switch/rotation/role-change/401/403 clear protected data before
      another subject renders

    ### Error Code Catalog
    | Code | Status | Description |
    |------|--------|-------------|
    | `validation_error` | 400 | Request body validation failed |
    | `unauthorized` | 401 | Authentication required |
    | `forbidden` | 403 | Insufficient permissions (deny-by-default) |
    | `not_found` | 404 | Resource not found |
    | `conflict` | 409 | Optimistic concurrency conflict |
    | `idempotency_payload_mismatch` | 409 | Idempotency-Key payload mismatch |
    | `rate_limited` | 429 | Rate limit exceeded |
    | `internal_error` | 500 | Unexpected server error |
    | `payment_failed` | 422 | Payment gateway failure |
    | `reservation_expired` | 422 | Inventory reservation expired |
    | `order_transition_invalid` | 422 | Invalid order state transition |
    | `slug_conflict` | 409 | Slug already in use |

servers:
  - url: /api/v1
    description: API v1

# ─────────────────────────────────────────────────────────────────────────────
# Security
# ─────────────────────────────────────────────────────────────────────────────
security:
  - cookieAuth: []

# ─────────────────────────────────────────────────────────────────────────────
# Tags (module groupings)
# ─────────────────────────────────────────────────────────────────────────────
tags:
  - name: Catalog
    description: Public catalog queries (products, posts, slug resolution)
  - name: Auth
    description: Customer email OTP authentication
  - name: StaffAuth
    description: Staff email OTP authentication
  - name: Cart
    description: Cart management
  - name: Checkout
    description: Quote and order placement
  - name: Payment
    description: VNPAY payment and status
  - name: GuestOrder
    description: Guest order lookup and tracking
  - name: CustomerOrder
    description: Customer order history and claim
  - name: AdminCatalog
    description: Admin product management
  - name: AdminContent
    description: Admin post management
  - name: AdminMedia
    description: Admin media management
  - name: AdminOrders
    description: Admin order queue and fulfillment
  - name: AdminPayment
    description: Admin refund operations
  - name: AdminStaff
    description: Admin staff management
  - name: AdminConfig
    description: Admin configuration

# ─────────────────────────────────────────────────────────────────────────────
# Paths (placeholder structure — operations added in subsequent stories)
# ─────────────────────────────────────────────────────────────────────────────
paths:
  /health:
    get:
      operationId: healthCheck
      summary: Health check endpoint
      tags: [Infrastructure]
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  # ── Public Catalog Operations ─────────────────────────────────────────────
  /products:
    get:
      operationId: listPublishedProducts
      summary: List published products
      tags: [Catalog]
      security: []
      x-permission: public.catalog.read
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Paginated list of published products
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/ProductSummary"

  /products/{slug}:
    get:
      operationId: getPublishedProduct
      summary: Get published product detail
      tags: [Catalog]
      security: []
      x-permission: public.catalog.read
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          description: Product URL slug
      responses:
        "200":
          description: Product detail with purchasable variants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /posts:
    get:
      operationId: listPublishedPosts
      summary: List published posts
      tags: [Catalog]
      security: []
      x-permission: public.catalog.read
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Paginated list of published posts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/PostSummary"

  /posts/{slug}:
    get:
      operationId: getPublishedPost
      summary: Get published post detail
      tags: [Catalog]
      security: []
      x-permission: public.catalog.read
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          description: Post URL slug
      responses:
        "200":
          description: Post detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /resolve/{slug}:
    get:
      operationId: resolvePublishedSlug
      summary: Resolve a slug to current resource or redirect
      tags: [Catalog]
      security: []
      x-permission: public.catalog.read
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          description: URL slug to resolve
      responses:
        "200":
          description: Resource found at current slug
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlugResolution"
        "301":
          description: Slug redirected (old slug → new resource)
          headers:
            Location:
              schema:
                type: string
              description: New canonical URL
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Customer Auth Operations ──────────────────────────────────────────────
  /auth/email-otp/challenges:
    post:
      operationId: createEmailOtpChallenge
      summary: Request email OTP challenge for customer
      tags: [Auth]
      security: []
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailOtpChallengeRequest"
      responses:
        "202":
          description: Challenge accepted (never reveals account existence)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeAccepted"

  /auth/email-otp/verifications:
    post:
      operationId: verifyEmailOtp
      summary: Verify email OTP and establish session
      tags: [Auth]
      security: []
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailOtpVerificationRequest"
      responses:
        "200":
          description: Verification successful, session established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthVerificationResponse"
        "401":
          description: Invalid or expired OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  # ── Cart Operations ───────────────────────────────────────────────────────
  /cart:
    get:
      operationId: getCart
      summary: Get current customer cart
      tags: [Cart]
      x-permission: cart.self.manage
      responses:
        "200":
          description: Current cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"

  /cart/items/{variantId}:
    put:
      operationId: putCartItem
      summary: Add or update cart item quantity
      tags: [Cart]
      x-permission: cart.self.manage
      parameters:
        - name: variantId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemInput"
      responses:
        "200":
          description: Cart updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
    delete:
      operationId: deleteCartItem
      summary: Remove item from cart
      tags: [Cart]
      x-permission: cart.self.manage
      parameters:
        - name: variantId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
      responses:
        "200":
          description: Cart updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"

  # ── Checkout Operations ───────────────────────────────────────────────────
  /checkout/quotes:
    post:
      operationId: createCheckoutQuote
      summary: Create a quote from current cart
      tags: [Checkout]
      x-permission: cart.self.manage
      responses:
        "201":
          description: Quote created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"

  /orders:
    post:
      operationId: placeOrder
      summary: Place an order from a quote (idempotent)
      tags: [Checkout]
      x-permission: checkout.self.place
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceOrderRequest"
      responses:
        "201":
          description: Order placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceOrderResult"

  # ── Payment Operations ────────────────────────────────────────────────────
  /payments/vnpay/{attemptId}/start:
    post:
      operationId: startVnpayPayment
      summary: Start VNPAY payment for an attempt
      tags: [Payment]
      x-permission: checkout.self.place
      parameters:
        - name: attemptId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
      responses:
        "200":
          description: VNPAY payment URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VnpayPaymentStartResponse"

  /orders/{orderId}/vnpay-attempts:
    post:
      operationId: retryVnpayPayment
      summary: Retry VNPAY payment for a failed attempt (idempotent)
      tags: [Payment]
      x-permission: payment.self.retry
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "200":
          description: VNPAY payment retry URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VnpayPaymentStartResponse"

  /checkout/payment-status:
    get:
      operationId: getCheckoutPaymentStatus
      summary: Get current order/payment/fulfillment status
      tags: [Checkout]
      x-permission: checkout.status.read
      parameters:
        - name: orderId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
      responses:
        "200":
          description: Order status projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderStatusProjection"

  # ── Guest Order Operations ────────────────────────────────────────────────
  /orders/guest/lookup-challenges:
    post:
      operationId: createGuestLookupChallenge
      summary: Create guest order lookup challenge (email OTP)
      tags: [GuestOrder]
      security: []
      x-permission: order.guest.read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailOtpChallengeRequest"
      responses:
        "202":
          description: Challenge accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeAccepted"

  /orders/guest/lookup-redemptions:
    post:
      operationId: redeemGuestLookup
      summary: Redeem guest lookup challenge to get order access
      tags: [GuestOrder]
      security: []
      x-permission: order.guest.read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailOtpVerificationRequest"
      responses:
        "200":
          description: Guest order access granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestOrderLookupResult"

  /orders/guest/current:
    get:
      operationId: getGuestOrder
      summary: Get current guest order
      tags: [GuestOrder]
      security: []
      x-permission: order.guest.read
      responses:
        "200":
          description: Guest order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Customer Order Operations ─────────────────────────────────────────────
  /me/orders:
    get:
      operationId: listMyOrders
      summary: List customer's own orders
      tags: [CustomerOrder]
      x-permission: order.self.read
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Paginated orders
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/OrderSummary"

  /me/orders/{orderId}:
    get:
      operationId: getMyOrder
      summary: Get customer's own order detail
      tags: [CustomerOrder]
      x-permission: order.self.read
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
      responses:
        "200":
          description: Order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /me/orders/claim-challenges:
    post:
      operationId: createOrderClaimChallenge
      summary: Create order claim challenge (email OTP for claiming past guest orders)
      tags: [CustomerOrder]
      x-permission: order.self.claim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailOtpChallengeRequest"
      responses:
        "202":
          description: Challenge accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeAccepted"

  /me/orders/claims:
    post:
      operationId: redeemOrderClaim
      summary: Redeem order claim to link guest order to customer account
      tags: [CustomerOrder]
      x-permission: order.self.claim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderClaimRedemptionRequest"
      responses:
        "200":
          description: Order claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"

  # ── Admin Product Operations ──────────────────────────────────────────────
  /admin/products:
    get:
      operationId: adminListProducts
      summary: List all products (admin)
      tags: [AdminCatalog]
      x-permission: catalog.manage
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Paginated products
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/AdminProductSummary"
    post:
      operationId: adminCreateProduct
      summary: Create new product draft
      tags: [AdminCatalog]
      x-permission: catalog.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminProductCreateRequest"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductDetail"

  /admin/products/{id}:
    get:
      operationId: adminGetProduct
      summary: Get product detail (admin)
      tags: [AdminCatalog]
      x-permission: catalog.manage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductDetail"
    patch:
      operationId: adminUpdateProduct
      summary: Update product
      tags: [AdminCatalog]
      x-permission: catalog.manage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
        - $ref: "#/components/parameters/ExpectedVersionHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminProductUpdateRequest"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductDetail"

  /admin/products/{id}/publish:
    post:
      operationId: adminPublishProduct
      summary: Publish product
      tags: [AdminCatalog]
      x-permission: catalog.manage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
      responses:
        "200":
          description: Product published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductDetail"

  /admin/products/{id}/archive:
    post:
      operationId: adminArchiveProduct
      summary: Archive product
      tags: [AdminCatalog]
      x-permission: catalog.manage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
      responses:
        "200":
          description: Product archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductDetail"

  # ── Admin Variant Operations ──────────────────────────────────────────────
  /admin/products/{id}/variants:
    get:
      operationId: adminListVariants
      summary: List variants for product
      tags: [AdminCatalog]
      x-permission: catalog.manage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
      responses:
        "200":
          description: Variants list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminVariant"
    post:
      operationId: adminCreateVariant
      summary: Create variant
      tags: [AdminCatalog]
      x-permission: catalog.manage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminVariantCreateRequest"
      responses:
        "201":
          description: Variant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVariant"

  /admin/products/{productId}/variants/{variantId}:
    patch:
      operationId: adminUpdateVariant
      summary: Update variant
      tags: [AdminCatalog]
      x-permission: catalog.manage
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
        - name: variantId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
        - $ref: "#/components/parameters/ExpectedVersionHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminVariantUpdateRequest"
      responses:
        "200":
          description: Variant updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVariant"

  /admin/products/{productId}/variants/{variantId}/archive:
    post:
      operationId: adminArchiveVariant
      summary: Archive variant
      tags: [AdminCatalog]
      x-permission: catalog.manage
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
        - name: variantId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
      responses:
        "200":
          description: Variant archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVariant"

  /admin/products/{productId}/variants/{variantId}/adjust-stock:
    post:
      operationId: adminAdjustVariantStock
      summary: Adjust variant stock (idempotent)
      tags: [AdminCatalog]
      x-permission: catalog.manage
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
        - name: variantId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminStockAdjustRequest"
      responses:
        "200":
          description: Stock adjusted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVariant"

  # ── Admin Post Operations ─────────────────────────────────────────────────
  /admin/posts:
    get:
      operationId: adminListPosts
      summary: List all posts (admin)
      tags: [AdminContent]
      x-permission: content.manage
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Paginated posts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/AdminPostSummary"
    post:
      operationId: adminCreatePost
      summary: Create new post draft
      tags: [AdminContent]
      x-permission: content.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPostCreateRequest"
      responses:
        "201":
          description: Post created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPostDetail"

  /admin/posts/{id}:
    get:
      operationId: adminGetPost
      summary: Get post detail (admin)
      tags: [AdminContent]
      x-permission: content.manage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
      responses:
        "200":
          description: Post detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPostDetail"
    patch:
      operationId: adminUpdatePost
      summary: Update post
      tags: [AdminContent]
      x-permission: content.manage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
        - $ref: "#/components/parameters/ExpectedVersionHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPostUpdateRequest"
      responses:
        "200":
          description: Post updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPostDetail"

  /admin/posts/{id}/publish:
    post:
      operationId: adminPublishPost
      summary: Publish post
      tags: [AdminContent]
      x-permission: content.manage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
      responses:
        "200":
