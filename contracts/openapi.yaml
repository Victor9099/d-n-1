                $ref: "#/components/schemas/ProblemDetails"

# ─────────────────────────────────────────────────────────────────────────────
# Components
# ─────────────────────────────────────────────────────────────────────────────
components:
  # ── Security Schemes ──────────────────────────────────────────────────────
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: Secure/HttpOnly session cookie with SameSite policy

  # ── Shared Parameters ─────────────────────────────────────────────────────
  parameters:
    CursorParam:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque cursor for pagination (from previous response nextCursor)
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Maximum number of items per page
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: |
        Unique key binding one actor/scope + operation + canonical payload.
        Compatible replay returns original status/body.
        Payload mismatch returns idempotency_payload_mismatch.
    ExpectedVersionHeader:
      name: If-Match
      in: header
      schema:
        type: integer
      description: Expected aggregateVersion for optimistic concurrency

  # ── Shared Schemas ────────────────────────────────────────────────────────
  schemas:
    # ── Base Types ────────────────────────────────────────────────────────
    UUID:
      type: string
      format: uuid
      description: Opaque UUID identifier

    Timestamp:
      type: string
      format: date-time
      description: UTC ISO-8601 timestamp

    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          minimum: 0
          description: Amount in integer VND (never negative)
        currency:
          type: string
          enum: [VND]
          description: Currency code (always VND for MVP)
      description: Money value in integer VND

    # ── Pagination ────────────────────────────────────────────────────────
    PaginatedResponse:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: {}
          description: Array of items for current page
        nextCursor:
          type: string
          nullable: true
          description: Opaque cursor for next page (null if no more pages)
      description: Opaque cursor pagination response

    # ── Error Response ────────────────────────────────────────────────────
    ProblemDetails:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          description: URI identifying the problem type
        title:
          type: string
          description: Short human-readable summary
        status:
          type: integer
          description: HTTP status code
        code:
          $ref: "#/components/schemas/ErrorCode"
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence
        instance:
          type: string
          format: uri
          description: URI identifying the specific occurrence
        correlationId:
          type: string
          description: Correlation ID for debugging and support
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
          description: Field-level validation errors
      description: RFC 7807 Problem Details with extensions

    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          description: JSON pointer to the field with error
        code:
          type: string
          description: Machine-readable field error code
        message:
          type: string
          description: Human-readable field error message

    # ── Error Codes ─────────────────────────────────────────────────────
    ErrorCode:
      type: string
      description: Stable machine-readable error code
      enum:
        - validation_error
        - unauthorized
        - forbidden
        - not_found
        - conflict
        - idempotency_payload_mismatch
        - rate_limited
        - internal_error
        - payment_failed
        - reservation_expired
        - order_transition_invalid
        - slug_conflict

    # ── Versioned Projection ──────────────────────────────────────────────
    VersionedProjection:
      type: object
      required: [aggregateVersion, serverTime]
      properties:
        aggregateVersion:
          type: integer
          minimum: 1
          description: Monotonic version for optimistic concurrency
        serverTime:
          $ref: "#/components/schemas/Timestamp"
      description: Base for mutable projections requiring concurrency control

    # ── Media Reference ─────────────────────────────────────────────────
    MediaRef:
      type: object
      required: [id, url, altText]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        url:
          type: string
          format: uri
          description: CDN URL for the media asset
        altText:
          type: string
          description: Alt text for accessibility
        width:
          type: integer
          description: Image width in pixels
        height:
          type: integer
          description: Image height in pixels
      description: Immutable reference to a media asset

    # ── Price Range ─────────────────────────────────────────────────────
    PriceRange:
      type: object
      required: [min, max, currency]
      properties:
        min:
          type: integer
          minimum: 0
          description: Minimum price across variants (integer VND)
        max:
          type: integer
          minimum: 0
          description: Maximum price across variants (integer VND)
        currency:
          type: string
          enum: [VND]
      description: Price range derived from product variants

    # ── Product Schemas ─────────────────────────────────────────────────
    ProductSummary:
      type: object
      required: [id, name, slug, excerpt, coverMedia, priceRange]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        name:
          type: string
          description: Product display name
        slug:
          type: string
          description: URL slug (current canonical)
        excerpt:
          type: string
          description: Short description excerpt
        coverMedia:
          $ref: "#/components/schemas/MediaRef"
        priceRange:
          $ref: "#/components/schemas/PriceRange"
      description: Product summary for list views (never includes stock)

    Variant:
      type: object
      required: [id, size, color, skuCode, priceVnd, availability]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        size:
          type: string
          description: Size label (e.g. S, M, L, XL)
        color:
          type: string
          description: Color label
        skuCode:
          type: string
          description: Unique SKU code derived from product + size + color
        priceVnd:
          type: integer
          minimum: 0
          description: Price in integer VND — variant-level, never overridden at product level
        availability:
          type: string
          enum: [in_stock, low_stock, out_of_stock]
          description: Current availability (cart is optimistic — never pre-reserves)
      description: |
        Purchasable size-color combination. Price is always at variant level.
        Availability is informational — stock is reserved at checkout, not cart.

    ComplianceInfo:
      type: object
      properties:
        careInstructions:
          type: array
          items:
            type: string
        materialComposition:
          type: string
        countryOfOrigin:
          type: string
      description: Compliance and care information

    OriginInfo:
      type: object
      properties:
        manufacturer:
          type: string
        countryOfOrigin:
          type: string
        importDate:
          $ref: "#/components/schemas/Timestamp"
      description: Product origin and sourcing information

    ProductDetail:
      type: object
      required: [id, name, slug, description, variants, complianceInfo, media]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          description: Full product description (may contain HTML)
        variants:
          type: array
          items:
            $ref: "#/components/schemas/Variant"
          description: All purchasable variants (size × color combinations)
        complianceInfo:
          $ref: "#/components/schemas/ComplianceInfo"
        originInfo:
          $ref: "#/components/schemas/OriginInfo"
        media:
          type: array
          items:
            $ref: "#/components/schemas/MediaRef"
          description: All finalized media assets for this product
        priceRange:
          $ref: "#/components/schemas/PriceRange"
      description: Full product detail with all variants and compliance info

    # ── Post Schemas ────────────────────────────────────────────────────
    PostSummary:
      type: object
      required: [id, title, slug, excerpt, coverMedia, publishedAt]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        title:
          type: string
        slug:
          type: string
        excerpt:
          type: string
          description: Short excerpt for preview
        coverMedia:
          $ref: "#/components/schemas/MediaRef"
        publishedAt:
          $ref: "#/components/schemas/Timestamp"
      description: Post summary for list views

    PostDetail:
      type: object
      required: [id, title, slug, excerpt, body, coverMedia, publishedAt]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        title:
          type: string
        slug:
          type: string
        excerpt:
          type: string
        body:
          type: string
          description: Full post body (may contain HTML/RichText)
        coverMedia:
          $ref: "#/components/schemas/MediaRef"
        attachedMedia:
          type: array
          items:
            $ref: "#/components/schemas/MediaRef"
          description: Media attached to this post
        publishedAt:
          $ref: "#/components/schemas/Timestamp"
      description: Full post detail with body and attached media

    # ── Slug Resolution ─────────────────────────────────────────────────
    SlugResolution:
      type: object
      required: [type, id, slug]
      properties:
        type:
          type: string
          enum: [product, post]
        id:
          $ref: "#/components/schemas/UUID"
        slug:
          type: string
          description: Current canonical slug
      description: Resolved slug → resource mapping

    # ── Auth Schemas ────────────────────────────────────────────────────
    EmailOtpChallengeRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: Email address to send OTP to
      description: |
        Request an OTP challenge. Response is always the same shape
        regardless of whether an account exists (non-enumerating).

    EmailOtpVerificationRequest:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          description: OTP code received via email
      description: Verify an OTP code for the given email

    AuthVerificationResponse:
      type: object
      required: [session, serverTime]
      properties:
        session:
          type: object
          required: [userId, role, expiresAt]
          properties:
            userId:
              $ref: "#/components/schemas/UUID"
            role:
              type: string
              enum: [customer, staff]
            permissions:
              type: array
              items:
                $ref: "#/components/schemas/PermissionId"
            expiresAt:
              $ref: "#/components/schemas/Timestamp"
        serverTime:
          $ref: "#/components/schemas/Timestamp"
      description: Successful authentication response with session info

    # ── Cart Schemas ────────────────────────────────────────────────────
    CartItemInput:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 0
          description: Desired quantity (0 removes item)
      description: |
        Cart item input. Quantity 0 removes the item.
        Stock is NOT reserved until checkout — cart is optimistic.

    CartItem:
      type: object
      required: [variantId, quantity, variant]
      properties:
        variantId:
          $ref: "#/components/schemas/UUID"
        quantity:
          type: integer
          minimum: 1
        variant:
          $ref: "#/components/schemas/Variant"
      description: Cart line item with snapshot of variant at time of addition

    Cart:
      type: object
      required: [items, updatedAt]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
      description: |
        Customer cart. Never represents stock as reserved.
        Items reference snapshot of variant — price/availability re-evaluated at checkout.

    # ── Checkout Schemas ────────────────────────────────────────────────
    Quote:
      type: object
      required: [quoteId, expiresAt, serverTime, itemSubtotal, shipping, discount, tax, grandTotal, currency]
      properties:
        quoteId:
          $ref: "#/components/schemas/UUID"
        expiresAt:
          $ref: "#/components/schemas/Timestamp"
        serverTime:
          $ref: "#/components/schemas/Timestamp"
        itemSubtotal:
          type: integer
          minimum: 0
          description: Sum of (variant.priceVnd * quantity) for all items (integer VND)
        shipping:
          type: integer
          minimum: 0
          description: |
            Shipping fee (integer VND).
            Rule: 30,000 VND when itemSubtotal < 500,000 VND; 0 otherwise.
        discount:
          type: integer
          minimum: 0
          description: Total discount amount (integer VND)
        tax:
          type: integer
          minimum: 0
          description: Tax amount (integer VND)
        grandTotal:
          type: integer
          minimum: 0
          description: |
            grand_total = item_subtotal + shipping - discount + tax
        currency:
          type: string
          enum: [VND]
      description: |
        Time-bounded quote. Does not expose reservation ID or imply held stock.
        Stock reservation happens at order placement.

    AddressInput:
      type: object
      required: [recipientName, recipientEmail, recipientPhone, provinceCity, wardCommune]
      properties:
        recipientName:
          type: string
        recipientEmail:
          type: string
          format: email
        recipientPhone:
          type: string
        provinceCity:
          type: string
          description: Province or city name
        district:
          type: string
          description: District name (NOT required in MVP)
        wardCommune:
          type: string
          description: Ward or commune name
        streetAddress:
          type: string
          description: Street address (optional for MVP)
      description: Shipping address — district is optional per spec

    PlaceOrderRequest:
      type: object
      required: [quoteId, shippingAddress]
      properties:
        quoteId:
          $ref: "#/components/schemas/UUID"
        shippingAddress:
          $ref: "#/components/schemas/AddressInput"
        note:
          type: string
          description: Optional order note from customer
      description: Order placement request (must be idempotent)

    InventoryReservation:
      type: object
      required: [id, expiresAt]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        expiresAt:
          $ref: "#/components/schemas/Timestamp"
      description: |
        Temporary inventory reservation. Expires if payment not completed.
        Separate from payment — payment retry does not require new reservation unless expired.

    PlaceOrderResult:
      type: object
      required: [order, paymentAttempt]
      properties:
        order:
          $ref: "#/components/schemas/OrderDetail"
        paymentAttempt:
          $ref: "#/components/schemas/PaymentAttempt"
        reservation:
          $ref: "#/components/schemas/InventoryReservation"
        checkoutSession:
          type: object
          description: Checkout continuation session for retry/continue flows
          properties:
            continueUrl:
              type: string
              format: uri
            expiresAt:
              $ref: "#/components/schemas/Timestamp"
      description: Order placement result with payment attempt and optional reservation

    # ── Order Schemas ───────────────────────────────────────────────────
    OrderStatus:
      type: string
      enum: [pending, confirmed, processing, shipped, delivered, cancelled, failed_delivery]
      description: Order lifecycle status

    PaymentStatus:
      type: string
      enum: [pending, processing, settled, failed, refund_required, refunded]
      description: Payment lifecycle status

    FulfillmentStatus:
      type: string
      enum: [unfulfilled, partial, fulfilled]
      description: Fulfillment lifecycle status

    OrderSummary:
      type: object
      required: [id, orderNumber, status, grandTotal, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        orderNumber:
          type: string
          description: Human-readable order number
        status:
          $ref: "#/components/schemas/OrderStatus"
        grandTotal:
          type: integer
          minimum: 0
          description: Grand total in integer VND
        createdAt:
          $ref: "#/components/schemas/Timestamp"
      description: Order summary for list views

    OrderLineItem:
      type: object
      required: [variantId, quantity, unitPrice, total]
      properties:
        variantId:
          $ref: "#/components/schemas/UUID"
        quantity:
          type: integer
        unitPrice:
          type: integer
          minimum: 0
          description: Unit price at order time (immutable snapshot)
        total:
          type: integer
          minimum: 0
          description: unitPrice * quantity
        variantName:
          type: string
        skuCode:
          type: string
      description: Immutable snapshot of order line item at placement time

    OrderDetail:
      type: object
      required: [id, orderNumber, status, items, grandTotal, shippingAddress, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        orderNumber:
          type: string
        status:
          $ref: "#/components/schemas/OrderStatus"
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderLineItem"
        itemSubtotal:
          type: integer
          minimum: 0
        shipping:
          type: integer
          minimum: 0
        discount:
          type: integer
          minimum: 0
        tax:
          type: integer
          minimum: 0
        grandTotal:
          type: integer
          minimum: 0
        shippingAddress:
          $ref: "#/components/schemas/AddressInput"
        paymentStatus:
          $ref: "#/components/schemas/PaymentStatus"
        fulfillmentStatus:
          $ref: "#/components/schemas/FulfillmentStatus"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
      description: Full order detail with immutable item snapshots

    # ── Payment Schemas ─────────────────────────────────────────────────
    PaymentAttempt:
      type: object
      required: [id, orderId, status, amount, currency, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        orderId:
          $ref: "#/components/schemas/UUID"
        status:
          $ref: "#/components/schemas/PaymentStatus"
        amount:
          type: integer
          minimum: 0
          description: Payment amount in integer VND
        currency:
          type: string
          enum: [VND]
        method:
          type: string
          enum: [vnpay]
        createdAt:
          $ref: "#/components/schemas/Timestamp"
      description: Payment attempt record

    VnpayPaymentStartResponse:
      type: object
      required: [paymentUrl, attemptId, expiresAt]
      properties:
        paymentUrl:
          type: string
          format: uri
          description: VNPAY hosted payment page URL
        attemptId:
          $ref: "#/components/schemas/UUID"
        expiresAt:
          $ref: "#/components/schemas/Timestamp"
      description: VNPAY payment initiation response

    OrderStatusProjection:
      type: object
      required: [aggregateVersion, serverTime, orderStatus, paymentStatus, fulfillmentStatus, permittedNextActions]
      properties:
        aggregateVersion:
          type: integer
          minimum: 1
          description: Monotonic version for optimistic concurrency
        serverTime:
          $ref: "#/components/schemas/Timestamp"
        orderStatus:
          $ref: "#/components/schemas/OrderStatus"
        paymentStatus:
          $ref: "#/components/schemas/PaymentStatus"
        fulfillmentStatus:
          $ref: "#/components/schemas/FulfillmentStatus"
        reservationExpiry:
          $ref: "#/components/schemas/Timestamp"
        refundSubstate:
          type: string
          enum: [none, pending, processing, completed, failed]
          description: Sub-state for refund tracking
        permittedNextActions:
          type: array
          items:
            type: string
          description: Actions the current actor is permitted to take
      description: |
        Combined order/payment/fulfillment status projection.
        Includes permitted next actions for UI-driven workflows.

    # ── Guest Order Schemas ─────────────────────────────────────────────
    GuestOrderLookupResult:
      type: object
      required: [access, serverTime]
      properties:
        access:
          type: object
          properties:
            orderId:
              $ref: "#/components/schemas/UUID"
            accessExpiresAt:
              $ref: "#/components/schemas/Timestamp"
        serverTime:
          $ref: "#/components/schemas/Timestamp"
      description: Guest lookup result with temporary order access

    OrderClaimRedemptionRequest:
      type: object
      required: [email, code, orderId]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          description: OTP code from claim challenge
        orderId:
          $ref: "#/components/schemas/UUID"
      description: Request to claim a guest order into customer account

    # ── Admin Product Schemas ───────────────────────────────────────────
    ProductStatus:
      type: string
      enum: [draft, published, archived]

    AdminProductSummary:
      type: object
      required: [id, name, slug, status, variantCount, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        name:
          type: string
        slug:
          type: string
        status:
          $ref: "#/components/schemas/ProductStatus"
        variantCount:
          type: integer
        createdAt:
          $ref: "#/components/schemas/Timestamp"

    AdminProductCreateRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
        slug:
          type: string
        excerpt:
          type: string
        description:
          type: string

    AdminProductUpdateRequest:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        excerpt:
          type: string
        description:
          type: string

    AdminProductDetail:
      allOf:
        - $ref: "#/components/schemas/AdminProductSummary"
        - type: object
          properties:
            description:
              type: string
            complianceInfo:
              $ref: "#/components/schemas/ComplianceInfo"
            originInfo:
              $ref: "#/components/schemas/OriginInfo"
            aggregateVersion:
              type: integer
            serverTime:
              $ref: "#/components/schemas/Timestamp"

    AdminVariant:
      allOf:
        - $ref: "#/components/schemas/Variant"
        - type: object
          required: [stockQuantity, status]
          properties:
            stockQuantity:
              type: integer
              minimum: 0
            status:
              type: string
              enum: [active, archived]

    AdminVariantCreateRequest:
      type: object
      required: [size, color, priceVnd]
      properties:
        size:
          type: string
        color:
          type: string
        priceVnd:
          type: integer
          minimum: 0
        stockQuantity:
          type: integer
          minimum: 0
          default: 0

    AdminVariantUpdateRequest:
      type: object
      properties:
        priceVnd:
          type: integer
          minimum: 0
        stockQuantity:
          type: integer
          minimum: 0

    AdminStockAdjustRequest:
      type: object
      required: [delta]
      properties:
        delta:
          type: integer
          description: Positive to add, negative to remove stock
        reason:
          type: string

    # ── Admin Post Schemas ──────────────────────────────────────────────
    PostStatus:
      type: string
      enum: [draft, published, archived]

    AdminPostSummary:
      type: object
      required: [id, title, slug, status, publishedAt]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        title:
          type: string
        slug:
          type: string
        status:
          $ref: "#/components/schemas/PostStatus"
        publishedAt:
          $ref: "#/components/schemas/Timestamp"

    AdminPostCreateRequest:
      type: object
      required: [title, slug]
      properties:
        title:
          type: string
        slug:
          type: string
        excerpt:
          type: string
        body:
          type: string

    AdminPostUpdateRequest:
      type: object
      properties:
        title:
          type: string
        slug:
          type: string
        excerpt:
          type: string
        body:
          type: string

    AdminPostDetail:
      allOf:
        - $ref: "#/components/schemas/AdminPostSummary"
        - type: object
          properties:
            excerpt:
              type: string
            body:
              type: string
            aggregateVersion:
              type: integer
            serverTime:
              $ref: "#/components/schemas/Timestamp"

    # ── Admin Media Schemas ─────────────────────────────────────────────
    MediaUploadAuthorizationRequest:
      type: object
      required: [filename, contentType, sizeBytes]
      properties:
        filename:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
          minimum: 1

    MediaUploadAuthorization:
      type: object
      required: [uploadId, uploadUrl, expiresAt]
      properties:
        uploadId:
          $ref: "#/components/schemas/UUID"
        uploadUrl:
          type: string
          format: uri
          description: Pre-signed URL for direct CDN upload
        expiresAt:
          $ref: "#/components/schemas/Timestamp"

    MediaFinalizeRequest:
      type: object
      required: [uploadId]
      properties:
        uploadId:
          $ref: "#/components/schemas/UUID"
        altText:
          type: string

    MediaAsset:
      type: object
      required: [id, url, status, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        url:
          type: string
          format: uri
        altText:
          type: string
        status:
          type: string
          enum: [pending, finalized, orphaned]
        attachedTo:
          type: array
          items:
            type: object
            properties:
              resourceType:
                type: string
                enum: [product, post]
              resourceId:
                $ref: "#/components/schemas/UUID"
        createdAt:
          $ref: "#/components/schemas/Timestamp"

    MediaAttachRequest:
      type: object
      required: [resourceType, resourceId]
      properties:
        resourceType:
          type: string
          enum: [product, post]
        resourceId:
          $ref: "#/components/schemas/UUID"

    MediaDetachRequest:
      type: object
      required: [resourceType, resourceId]
      properties:
        resourceType:
          type: string
          enum: [product, post]
        resourceId:
          $ref: "#/components/schemas/UUID"

    # ── Admin Order Schemas ─────────────────────────────────────────────
    AdminOrderSummary:
      allOf:
        - $ref: "#/components/schemas/OrderSummary"
        - type: object
          properties:
            recipientName:
              type: string
              description: PII — visibility depends on role
            recipientEmail:
              type: string
              description: PII — visibility depends on role
            paymentStatus:
              $ref: "#/components/schemas/PaymentStatus"

    AdminOrderDetail:
      allOf:
        - $ref: "#/components/schemas/OrderDetail"
        - type: object
          properties:
            aggregateVersion:
              type: integer
            serverTime:
              $ref: "#/components/schemas/Timestamp"
            auditLog:
              type: array
              items:
                $ref: "#/components/schemas/AuditEntry"

    AdminOrderTransitionRequest:
      type: object
      required: [targetStatus]
      properties:
        targetStatus:
          $ref: "#/components/schemas/OrderStatus"
        reason:
          type: string
        fulfillmentInfo:
          type: object
          properties:
            trackingNumber:
              type: string
            carrier:
              type: string

    # ── Admin Refund Schemas ────────────────────────────────────────────
    AdminRefundRequest:
      type: object
      required: [amount, reason]
      properties:
        amount:
          type: integer
          minimum: 1
          description: Refund amount in integer VND (can be partial)
        reason:
          type: string

    AdminRefundResult:
      type: object
      required: [attemptId, refundStatus, refundAmount]
      properties:
        attemptId:
          $ref: "#/components/schemas/UUID"
        refundStatus:
          type: string
          enum: [none, pending, processing, completed, failed]
        refundAmount:
          type: integer
          minimum: 0
        gatewayRef:
          type: string
          description: Gateway reference ID for reconciliation
        updatedAt:
          $ref: "#/components/schemas/Timestamp"

    # ── Admin Staff Schemas ─────────────────────────────────────────────
    StaffAccount:
      type: object
      required: [id, email, status, role, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        email:
          type: string
          format: email
        status:
          type: string
          enum: [active, disabled]
        role:
          type: string
          enum: [owner_admin, catalog_editor, order_operator]
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionId"
        createdAt:
          $ref: "#/components/schemas/Timestamp"

    AdminStaffCreateRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [owner_admin, catalog_editor, order_operator]

    RoleAssignment:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [owner_admin, catalog_editor, order_operator]

    ShippingConfigRead:
      type: object
      required: [freeShippingThreshold, baseShippingFee, currency]
      properties:
        freeShippingThreshold:
          type: integer
          minimum: 0
          description: Merchandise subtotal threshold for free shipping (integer VND)
        baseShippingFee:
          type: integer
          minimum: 0
          description: Base shipping fee below threshold (integer VND)
        currency:
          type: string
          enum: [VND]

    AuditEntry:
      type: object
      required: [timestamp, actor, action]
      properties:
        timestamp:
          $ref: "#/components/schemas/Timestamp"
        actor:
          type: object
          properties:
            id:
              $ref: "#/components/schemas/UUID"
            type:
              type: string
              enum: [customer, staff, system]
        action:
          type: string
          description: Human-readable action description
        metadata:
          type: object
          additionalProperties: true

    # ── Domain Events ───────────────────────────────────────────────────
    DomainEventEnvelope:
      type: object
      required: [eventId, eventType, aggregateId, aggregateType, orderingKey, occurredAt, correlationId]
      properties:
        eventId:
          $ref: "#/components/schemas/UUID"
        eventType:
          type: string
          description: Semantic versioned event type (e.g. order.placed.v1)
        aggregateId:
          $ref: "#/components/schemas/UUID"
        aggregateType:
          type: string
          enum: [product, post, variant, order, payment, media, identity]
        orderingKey:
          type: string
          description: Monotonic ordering key for consumer sequencing
        occurredAt:
          $ref: "#/components/schemas/Timestamp"
        correlationId:
          $ref: "#/components/schemas/UUID"
        payload:
          type: object
          additionalProperties: true
          description: Event-specific payload (never contains raw challenge material)
      description: |
        Domain event envelope. All 17 event types use this envelope.
        Payload is event-specific — see individual event payload schemas.
        No raw challenge material (OTP codes, tokens) appears in any payload.

    # Event types (for reference — actual events use DomainEventEnvelope with specific payloads):
    # Catalog: product.created.v1, product.published.v1, product.archived.v1,
    #          post.created.v1, post.published.v1, post.archived.v1
    # Inventory: inventory.adjusted.v1
    # Order: order.placed.v1, order.confirmed.v1, order.processing.v1,
    #        order.shipped.v1, order.delivered.v1, order.cancelled.v1,
    #        order.failed_delivery.v1
    # Payment: payment.attempt_created.v1, payment.settled.v1,
    #          payment.refund_required.v1, payment.refunded.v1
    # Media: media.upload_finalized.v1, media.orphan_cleaned.v1
    # Identity: identity.challenge_created.v1, identity.challenge_consumed.v1

    # ── Health ────────────────────────────────────────────────────────────
    HealthResponse:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        timestamp:
          $ref: "#/components/schemas/Timestamp"

    # ── Challenge ─────────────────────────────────────────────────────────
    ChallengeAccepted:
      type: object
      required: [expiresAt, resendAfter, serverTime]
      properties:
        expiresAt:
          $ref: "#/components/schemas/Timestamp"
        resendAfter:
          $ref: "#/components/schemas/Timestamp"
        serverTime:
          $ref: "#/components/schemas/Timestamp"
      description: |
        Non-enumerating challenge response. Always returns this shape
        regardless of whether an account/order exists.

    # ── Permission IDs ────────────────────────────────────────────────────
    PermissionId:
      type: string
      description: |
        Stable permission identifier from authorization matrix.
        Every protected operation references exactly one permission ID.
        Deny-by-default: missing permission = no access.
      enum:
        - public
        - public.catalog.read
        - cart.self.manage
        - checkout.self.place
        - checkout.status.read
        - payment.self.retry
        - order.guest.read
        - order.self.read
        - order.self.claim
        - catalog.manage
        - content.manage
        - media.manage
        - order.ops.read
        - order.ops.transition
        - payment.refund
        - staff.manage
        - config.read

  # ── Shared Responses ──────────────────────────────────────────────────────
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Forbidden:
      description: Insufficient permissions (deny-by-default)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Conflict:
      description: Optimistic concurrency conflict (aggregateVersion mismatch)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    IdempotencyMismatch:
      description: Idempotency key payload mismatch
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
